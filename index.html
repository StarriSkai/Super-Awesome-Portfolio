<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Webpage</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fb;
      --text: #1f2937;
      --card: #ffffff;
      --accent: #2563eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --text: #e5e7eb;
        --card: #121a2b;
        --accent: #60a5fa;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .container {
      width: min(800px, 100%);
      background: var(--card);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
    }

    p {
      line-height: 1.6;
      margin: 0.75rem 0 0;
    }

    .btn {
      margin-top: 1.25rem;
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: white;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      font-weight: 700;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Welcome to My Webpage</h1>
    <p>This is a simple, modern HTML page you can customize for your project.</p>
    <p>Change the text, colors, and layout to make it your own.</p>
    <a class="btn" href="#" aria-label="Learn more">Learn More</a>
    <footer>&copy; 2026 Your Name</footer>
  </main>
</body>
</html>
