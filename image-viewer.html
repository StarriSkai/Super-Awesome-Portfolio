<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-inner page-image-viewer">
  <a class="back-nav btn btn--ghost" id="viewer-back" href="index.html" aria-label="Back">BACK</a>
  <div class="stars-sky" aria-hidden="true">
    <span class="star star--sm" style="top: 14%; left: 3%">✦</span>
    <span class="star star--lg" style="top: 9%; left: 20%; transform: rotate(-10deg)">★</span>
    <span class="star star--2xs" style="top: 26%; left: 6%">✧</span>
    <span class="star star--md" style="top: 38%; left: 1%">★</span>
    <span class="star star--xs" style="top: 52%; left: 4%; transform: rotate(15deg)">✦</span>
    <span class="star star--xl" style="top: 66%; left: 2%">✧</span>
    <span class="star star--sm" style="top: 80%; left: 7%">★</span>
    <span class="star star--md" style="bottom: 12%; left: 5%">✦</span>
    <span class="star star--xs" style="bottom: 22%; left: 14%">✧</span>
    <span class="star star--xxl" style="bottom: 6%; left: 28%; transform: rotate(8deg)">★</span>
    <span class="star star--sm" style="top: 18%; right: 4%">★</span>
    <span class="star star--md" style="top: 32%; right: 2%">✦</span>
    <span class="star star--2xs" style="top: 44%; right: 8%">✧</span>
    <span class="star star--lg" style="top: 58%; right: 3%; transform: rotate(-14deg)">★</span>
    <span class="star star--xs" style="top: 72%; right: 6%">✦</span>
    <span class="star star--sm" style="top: 86%; right: 2%">✧</span>
    <span class="star star--xl" style="bottom: 18%; right: 5%">★</span>
    <span class="star star--md" style="bottom: 8%; right: 12%">✦</span>
    <span class="star star--xs" style="top: 4%; left: 42%">✧</span>
    <span class="star star--sm" style="top: 47%; left: 11%">★</span>
    <span class="star star--lg" style="top: 60%; right: 16%">✧</span>
    <span class="star star--2xs" style="bottom: 38%; left: 20%">✦</span>
    <span class="star star--md" style="bottom: 32%; right: 18%">★</span>
    <span class="star star--2xs" style="top: 6%; left: 50%">✧</span>
    <span class="star star--xs" style="top: 19%; left: 72%; transform: rotate(18deg)">✦</span>
    <span class="star star--sm" style="top: 28%; left: 38%">★</span>
    <span class="star star--md" style="top: 35%; left: 58%">✧</span>
    <span class="star star--2xs" style="top: 42%; left: 82%">✦</span>
    <span class="star star--lg" style="top: 55%; left: 32%; transform: rotate(-8deg)">★</span>
    <span class="star star--xs" style="top: 63%; left: 52%">✧</span>
    <span class="star star--sm" style="top: 74%; left: 78%">✦</span>
    <span class="star star--md" style="top: 11%; left: 88%">★</span>
    <span class="star star--2xs" style="bottom: 48%; left: 10%">✧</span>
    <span class="star star--xs" style="bottom: 55%; right: 22%; transform: rotate(12deg)">★</span>
    <span class="star star--sm" style="top: 48%; left: 66%">✦</span>
    <span class="star star--xl" style="bottom: 42%; left: 48%">✧</span>
    <span class="star star--md" style="top: 2%; right: 35%">★</span>
    <span class="star star--xs" style="bottom: 18%; left: 62%">✦</span>
    <span class="star star--sm" style="top: 41%; left: 24%; transform: rotate(-20deg)">✧</span>
    <span class="star star--2xs" style="bottom: 62%; right: 8%">★</span>
    <span class="star star--lg" style="top: 85%; left: 52%">✦</span>
  </div>

  <main class="container image-viewer">
    <div class="image-viewer__controls" id="viewer-controls" hidden>
      <label class="image-viewer__slider-wrap" for="viewer-slider">
        <span class="image-viewer__slider-label">Cardboard</span>
        <input
          class="image-viewer__slider"
          id="viewer-slider"
          type="range"
          min="1"
          max="1"
          step="1"
          value="1"
          aria-label="Choose image in series"
        />
      </label>
      <output class="image-viewer__slider-count" id="viewer-slider-count" for="viewer-slider">1 / 1</output>
    </div>
    <div class="image-viewer__stage" id="viewer-stage" aria-label="Image viewer stage">
      <img id="viewer-image" src="" alt="Artwork image" />
    </div>
  </main>

  <script src="image-viewer.js" defer></script>
</body>
</html>
